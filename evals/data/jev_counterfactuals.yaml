  # ------------------------------------------------------------ props
  - family: prop_erg11_azoles
    task: proposals
    match: {gene_id: "ERG11", symbol: "ERG11", organism: "Candida albicans"}
    node: "pubmed:31001001"
    claim: "ERG11 expression increases upon fluconazole exposure"
    rungs:
      L3:
        text: "Candida albicans ERG11 mRNA increased 4.8-fold after 24 h of fluconazole treatment, consistent with azole-driven upregulation of the sterol pathway."
        quote: "ERG11 mRNA increased 4.8-fold after 24 h of fluconazole treatment"
      L2:
        text: "Putative sterol-pathway transcripts, including those of the lanosterol demethylase family, showed modest non-significant upward trends under azole stress."
        quote: "sterol-pathway transcripts showed modest non-significant upward trends under azole stress"
      L1:
        text: "ERG3 transcript abundance rose markedly after fluconazole treatment, whereas ERG11 levels were unchanged in the matched samples."
        quote: "ERG11 levels were unchanged"
      L0:
        text: "Cultures were grown at 30 degrees C in YPD medium supplemented with 2% glucose, and cells were harvested in mid-log phase for RNA extraction."
        quote: "cells were harvested in mid-log phase for RNA extraction"

  - family: prop_crt_transport
    task: proposals
    match: {gene_id: "PF3D7_0709000", symbol: "CRT", organism: "Plasmodium falciparum 3D7"}
    node: "pubmed:31001002"
    claim: "pfcrt K76T mutation confers chloroquine resistance"
    rungs:
      L3:
        text: "Parasites carrying the K76T mutation in pfcrt displayed 8-fold higher chloroquine IC50 values than wild-type controls, establishing K76T as a marker of chloroquine resistance."
        quote: "K76T mutation in pfcrt displayed 8-fold higher chloroquine IC50 values"
      L2:
        text: "Several digestive-vacuole membrane polymorphisms were observed at higher frequency in resistant isolates, though their individual contributions remain unclear."
        quote: "polymorphisms were observed at higher frequency in resistant isolates"
      L1:
        text: "The pfmdr1 N86Y substitution was enriched among chloroquine-resistant lines, while pfcrt remained wild type across all resistant clones examined."
        quote: "pfcrt remained wild type across all resistant clones"
      L0:
        text: "Blood samples were collected from patients presenting with uncomplicated malaria and stored in EDTA tubes at -20 degrees C until DNA extraction."
        quote: "stored in EDTA tubes at -20 degrees C"

  - family: prop_katg_inh
    task: proposals
    match: {gene_id: "885807", symbol: "katG", organism: "Mycobacterium tuberculosis H37Rv"}
    node: "pubmed:31001003"
    claim: "katG is required for isoniazid activation"
    rungs:
      L3:
        text: "Isoniazid is a prodrug activated by the catalase-peroxidase KatG; katG deletion mutants were fully resistant to isoniazid in vitro."
        quote: "katG deletion mutants were fully resistant to isoniazid"
      L2:
        text: "Loss of catalase-peroxidase activity was frequently associated with reduced drug susceptibility in the clinical isolates examined."
        quote: "loss of catalase-peroxidase activity was frequently associated with reduced drug susceptibility"
      L1:
        text: "The inhA promoter up-mutation conferred isoniazid resistance independently of katG, which remained functional in all resistant strains tested."
        quote: "katG remained functional in all resistant strains"
      L0:
        text: "Genomic DNA was extracted using the cetyltrimethylammonium bromide method and quantified spectrophotometrically before sequencing."
        quote: "quantified spectrophotometrically before sequencing"

