# Suite 1B — controlled evidence-ladder counterfactuals.
#
# 30 probe families (10 per task) x 4 evidence rungs. Within a family the
# input/question/claim is held fixed; only the evidence the judge sees
# varies. Rung semantics (expected JEV noul order L3 > L2 > L1 > L0):
#
#   L3  direct support — the evidence answers the question outright
#   L2  partial/hedged — right ballpark, weaker or indirect support
#   L1  wrong species or paralog — real biology, wrong target
#   L0  unsupported/contradicted — plausible-looking noise, no support
#
# Per-rung payload keys:
#   s1_resolve:   candidate record fields (as NcbiClient normalizes them)
#   s5_expression: dataset candidate fields (as GEO/GXA fetchers emit)
#   proposals:    text (numbered source units) + quote (cited span)
