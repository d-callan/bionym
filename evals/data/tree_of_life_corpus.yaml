# 7 clades x 3 tiers x 3 genes = 63 real identifiers spanning BRC-relevant
# pathogen space plus vertebrate/host comparators. IDs marked `# verify`
# are best-effort from curation — evals/verify_corpus_ids.py must pass
# them live before any JEV spend.
#
# info_tier: well_studied | moderate | understudied
# deep_subset: the 7x3x1 stratified subset run Full (propose+summarize)
