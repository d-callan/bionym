# Cheap, quick-scan. Run on every change.
- id: abc123
  tier: t1
  name: garbage-string
  quick: true
  expect: { outcome: refused }

- id: K00001                 # KEGG ortholog entry — valid ID, not a gene
  tier: t1
  name: kegg-not-a-gene
  quick: true
  expect: { outcome: refused }

- id: "10.1038/s41586-020-2649-2"   # DOI
  tier: t1
  name: doi-not-a-gene
  quick: true
  expect: { outcome: refused }

- id: GCA_000002765.2        # P. falciparum 3D7 assembly accession — not a gene. verify
  tier: t1
  name: assembly-not-a-gene
  quick: true
  expect: { outcome: refused }

- id: PF3D7_0710100          # verified e2e — locus tag happy path
  tier: t1
  name: veupathdb-happy-quick
  quick: true
  expect: { outcome: resolved, anchor_ns: veupathdb }

