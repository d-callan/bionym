# Suite 2 — refusal, near-miss, wrong-entity, and ambiguity-trap corpus.
#
# 40 inputs a robust resolver must handle honestly:
#   * garbage / nonsense strings          -> refuse
#   * near-miss fabricated IDs            -> refuse (valid format, no record)
#   * wrong-entity real IDs               -> refuse (not a gene)
#   * ambiguity traps                     -> resolve correctly OR refuse;
#                                          honest-uncertainty outcomes are
#                                          recorded (expect: {}), not guessed
#
# expect.outcome semantics: "refused" asserts the resolver must not resolve;
# "resolved" asserts it must; omitted/empty expect records the outcome for
# the ambiguity report without asserting either way.

# ------------------------------------------------------------- garbage
- id: abc123
  tier: t1
  name: refuse-garbage-alnum
  quick: true
  expect: { outcome: refused }

- id: xyzzy
  tier: t1
  name: refuse-garbage-word
  quick: true
  expect: { outcome: refused }

- id: "!!!!"
  tier: t1
  name: refuse-garbage-symbols
  quick: true
  expect: { outcome: refused }

- id: "not a gene at all"
  tier: t1
  name: refuse-garbage-phrase
  quick: true
  expect: { outcome: refused }

- id: "12345678901"   # 11 digits — outside ncbi_gene {1,10} -> other
  tier: t1
  name: refuse-overlong-numeric
  quick: true
  expect: { outcome: refused }

- id: "00000000"
  tier: t1
  name: refuse-zero-padded-number
  quick: true
  expect: { outcome: refused }

