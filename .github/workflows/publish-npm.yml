name: Publish to npm

on:
  push:
    tags:
      - 'components-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: web/components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#components-v}"
          ver="$(node -p "require('./package.json').version")"
          [ "$tag" = "$ver" ] || { echo "tag components-v$tag != package.json version $ver"; exit 1; }
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Publish
        run: npm publish --provenance --access public
