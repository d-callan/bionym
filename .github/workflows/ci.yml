name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/components/package-lock.json
      - run: npm ci
        working-directory: web/components
      # bundle must match a fresh build (mtime check can't work on a checkout)
      - run: npm run build:report
        working-directory: web/components
      - run: git diff --exit-code src/bionym/_static/
      # playwright-core + the runner's preinstalled Chrome — no browser download
      - env:
          CHROME: /usr/bin/google-chrome
        run: node tests/test_ui.mjs
