<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioNym</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root { --ink:#1a202c; --muted:#4a5568; --line:#cbd5e0; --bg:#f7fafc; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; color: var(--ink); background: var(--bg); }
  header { padding: 1.2rem 2rem; border-bottom: 1px solid var(--line); background: #fff; }
  h1 { font-size: 1.3rem; margin: 0 0 .6rem; }
  .tagline { font-size: .8rem; font-weight: normal; color: var(--muted); margin-left: .6rem; }
  .tagline a { color: #2b6cb0; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  input[type=text] { padding: .45rem .7rem; border: 1px solid var(--line); border-radius: 6px; font-size: .95rem; width: 22rem; }
  input[type=number] { width: 4.5rem; padding: .45rem .5rem; border: 1px solid var(--line); border-radius: 6px; }
  button { padding: .45rem 1rem; border: 0; border-radius: 6px; background: #2b6cb0; color: #fff; font-size: .95rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  label { font-size: .8rem; color: var(--muted); }
  #status { padding: .6rem 2rem; font-size: .85rem; color: var(--muted); }
  #status.error { color: #c53030; }
  main { padding: 0 2rem 3rem; }
  h2 { font-size: 1.05rem; margin: 1.6rem 0 .5rem; }
  svg { background: #fff; border: 1px solid var(--line); border-radius: 8px; width: 100%; height: auto; }
  table { border-collapse: collapse; font-size: .82rem; background: #fff; }
  th, td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  th { background: #edf2f7; position: sticky; top: 0; }
  .tablewrap { max-height: 22rem; overflow: auto; border-radius: 8px; }
  .node { stroke: #fff; stroke-width: 1px; cursor: default; }
  .nodelabel { font-size: 9px; pointer-events: none; }
  .link { fill: none; }
  .colhead { font-size: 11px; font-weight: 600; fill: var(--muted); }
  .conf { font-variant-numeric: tabular-nums; }
  .tfilter { font-size: .8rem; padding: .2rem .5rem; border: 1px solid var(--line); border-radius: 5px; font-weight: normal; }
  h2 label { font-weight: normal; margin-left: .8rem; }
  #layout { font-size: .8rem; padding: .15rem .3rem; }
  #resetzoom, #zin, #zout { font-size: .75rem; padding: .2rem .6rem; margin-left: .5rem; background: #edf2f7; color: var(--ink); border: 1px solid var(--line); }
  #zin, #zout { width: 1.8rem; }
  #legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; padding: .4rem .2rem; font-size: .75rem; color: var(--muted); }
  #legend .leg { display: inline-flex; align-items: center; gap: .3rem; }
  #legend .leg i { width: .7rem; height: .7rem; border-radius: 50%; display: inline-block; }
  .nodeg.dim { opacity: .12; }
  .link.link-dim { stroke-opacity: .04; }
  .link.link-hi { stroke-opacity: .95; stroke: #2b6cb0; }
  .hint { font-size: .72rem; font-weight: normal; color: var(--muted); margin-left: .6rem; }
  svg#net { cursor: grab; }
  svg#net:active { cursor: grabbing; }
  th { cursor: pointer; user-select: none; }
  th:hover { background: #e2e8f0; }
  .modes { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .modes label { padding: .4rem .8rem; cursor: pointer; font-size: .85rem; color: var(--ink); background: #fff; }
  .modes input { position: absolute; opacity: 0; pointer-events: none; }
  .modes label:has(input:checked) { background: #2b6cb0; color: #fff; }
  details#summary { margin-top: 1.4rem; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: .6rem 1rem; }
  details#summary > summary { cursor: pointer; font-size: 1.05rem; font-weight: 600; }
  details#summary ul { margin: .6rem 0 .2rem; padding-left: 1.2rem; font-size: .88rem; }
  details#summary li { margin-bottom: .35rem; }
  .sumconf { color: var(--muted); font-size: .78rem; }
</style>
</head>
<body>
<header>
  <h1>BioNym <span class="tagline">identifiers → confidence-scored knowledge graphs, judged by <a href="https://typesafe.ai" target="_blank" rel="noopener">JEV (TypeSafe.ai)</a></span></h1>
  <form id="f">
    <input type="text" id="id" placeholder="identifier — e.g. PF3D7_0710100, 672, BRCA1" required>
    <button id="go" type="submit">Resolve</button>
    <span class="modes">
      <label title="Deterministic lookups + JEV-scored edges only — no AI-generated claims or summary. Usually seconds."><input type="radio" name="mode" value="quick">Quick scan</label>
      <label title="Everything: datasets, AI-proposed claims and a verified gene summary. Can take several minutes."><input type="radio" name="mode" value="full" checked>Full analysis</label>
    </span>
    <label>min conf <input type="range" id="minconf" min="0" max="1" step="0.05" value="0" style="width:8rem;vertical-align:middle"><span id="minconfv">0.00</span></label>
  </form>
</header>
<div id="status">Enter an identifier to resolve.</div>
<main>
  <details id="summary" open hidden>
    <summary>Summary</summary>
    <ul id="summarylist"></ul>
  </details>
  <h2>Network
    <label>layout
      <select id="layout">
        <option value="columns">multi-partite</option>
        <option value="force">force-directed</option>
      </select>
    </label>
    <button id="zout" type="button" title="zoom out">−</button>
    <button id="zin" type="button" title="zoom in">+</button>
    <button id="resetzoom" type="button">reset view</button>
    <span class="hint">scroll to zoom · drag to pan · hover a node to highlight its neighborhood</span>
  </h2>
  <svg id="net" viewBox="0 0 1400 700" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="legend"></div>
  <h2>Edges <input class="tfilter" data-for="edges" placeholder="filter…"></h2>
  <div class="tablewrap"><table id="edges"><thead><tr><th>subject</th><th>predicate</th><th>object</th><th>conf</th></tr></thead><tbody></tbody></table></div>
  <h2>Nodes <input class="tfilter" data-for="nodes" placeholder="filter…"></h2>
  <div class="tablewrap"><table id="nodes"><thead><tr><th>id</th><th>type</th><th>label</th><th>namespace</th><th></th></tr></thead><tbody></tbody></table></div>
</main>
<script>
const COLS = ["IdType","Gene","Organism","Assembly","OrthologGroup","Transcript","Protein","Domain","GOTerm","Pathway","Dataset","Condition","Publication"];
const COLORS = {IdType:"#8d99ae",Gene:"#2b6cb0",Organism:"#2f855a",Assembly:"#b7791f",OrthologGroup:"#6b46c1",Transcript:"#2b8a3e",Protein:"#087f5b",Domain:"#c05621",GOTerm:"#2c7a7b",Pathway:"#97266d",Dataset:"#4a5568",Condition:"#9b2c2c",Publication:"#5f3dc4"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let GRAPH = null;

// Admin-configurable: point at the deployed backend. Not user-facing.
const BACKEND = "http://localhost:8001";
const DEPTH = 6;  // full pipeline

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const id = $("#id").value.trim();
  const status = $("#status"); status.className = ""; status.textContent = "Resolving " + id + "…";
  $("#go").disabled = true;
  try {
    const mode = document.querySelector('input[name=mode]:checked').value;
    const r = await fetch(`${BACKEND}/api/resolve?identifier=${encodeURIComponent(id)}&depth=${DEPTH}&propose=${mode === "full"}&summarize=${mode === "full"}`);
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
    GRAPH = await r.json();
    d3.select("#net").call(zoom.transform, d3.zoomIdentity);  // new query resets view
    renderFiltered();
    const u = (GRAPH.metadata.jev_usage||{}).total||{};
    status.textContent = `${Object.keys(GRAPH.nodes).length} nodes, ${GRAPH.edges.length} edges · JEV ${u.input_tokens||0}in/${u.output_tokens||0}out · stages: ${(GRAPH.metadata.stages||[]).join(", ")}`;
  } catch (err) {
    status.className = "error"; status.textContent = "Error: " + err.message;
  } finally { $("#go").disabled = false; }
});

$("#minconf").addEventListener("input", e => {
  $("#minconfv").textContent = (+e.target.value).toFixed(2);
  if (GRAPH) renderFiltered();
});

// Client-side mirror of KnowledgeGraph.filter_by_confidence: drop edges
// below threshold, then nodes with no remaining edges (keep query root).
function renderFiltered() {
  const min = +$("#minconf").value;
  const edges = GRAPH.edges.filter(e => e.confidence >= min);
  const keep = new Set(edges.flatMap(e => [e.subject, e.object]));
  keep.add(GRAPH.metadata.query);
  const nodes = Object.values(GRAPH.nodes).filter(n => keep.has(n.id));
  render({nodes: Object.fromEntries(nodes.map(n=>[n.id,n])), edges, metadata: GRAPH.metadata});
}

function link(n) {
  return n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.label||n.id)}</a>` : esc(n.label||n.id);
}

// Best resolvable identifier for a node — used by the "resolve →" action
// to seed the next query (e.g. follow an ortholog when the query gene has
// no downstream data).
function resolveId(n) {
  if (n.attrs && n.attrs.resolve_id) return String(n.attrs.resolve_id);
  if (n.attrs && n.attrs.gene_id) return String(n.attrs.gene_id);
  const rest = n.id.includes(":") ? n.id.split(":").slice(1).join(":") : n.id;
  return rest || n.id;
}
function resolveNext(n) {
  $("#id").value = resolveId(n);
  $("#f").requestSubmit();
  window.scrollTo({top: 0, behavior: "smooth"});
}

// Sortable + filterable table. cols: [{label, val(row), render(row), cls?}]
function sortable(tableId, rows, cols, initKey = null, initDir = 1) {
  const tbl = document.getElementById(tableId);
  const tbody = tbl.querySelector("tbody");
  const ths = [...tbl.querySelectorAll("th")];
  const state = {key: initKey, dir: initDir, filter: ""};
  const fi = document.querySelector(`.tfilter[data-for="${tableId}"]`);
  if (fi) fi.addEventListener("input", e => { state.filter = e.target.value.toLowerCase(); draw(); });
  ths.forEach((th, i) => th.addEventListener("click", () => {
    if (state.key === i) state.dir *= -1; else { state.key = i; state.dir = 1; }
    draw();
  }));
  function draw() {
    let rs = rows.filter(r => !state.filter || cols.some(c => String(c.val(r) ?? "").toLowerCase().includes(state.filter)));
    if (state.key !== null) {
      const c = cols[state.key];
      rs = rs.slice().sort((a, b) => {
        const x = c.val(a), y = c.val(b);
        return (typeof x === "number" && typeof y === "number" ? x - y : String(x ?? "").localeCompare(String(y ?? ""))) * state.dir;
      });
    }
    tbody.innerHTML = rs.map(r => "<tr>" + cols.map(c => `<td class="${c.cls || ""}">${c.render(r)}</td>`).join("") + "</tr>").join("");
    ths.forEach((th, i) => th.textContent = cols[i].label + (state.key === i ? (state.dir > 0 ? " ▲" : " ▼") : ""));
  }
  draw();
}

// Pan/zoom transform on the viewport <g>; persists across re-renders
// (e.g. min-conf slider) but resets on a new query.
const zoom = d3.zoom().scaleExtent([0.2, 6]).on("zoom", e => {
  d3.select("#net .viewport").attr("transform", e.transform);
});
$("#resetzoom").addEventListener("click", () =>
  d3.select("#net").transition().duration(300).call(zoom.transform, d3.zoomIdentity));
$("#zin").addEventListener("click", () =>
  d3.select("#net").transition().duration(200).call(zoom.scaleBy, 1.4));
$("#zout").addEventListener("click", () =>
  d3.select("#net").transition().duration(200).call(zoom.scaleBy, 1/1.4));
$("#layout").addEventListener("change", () => { if (GRAPH) renderFiltered(); });

// Node positions: {id: {x, y}}. "columns" = multi-partite by type;
// "force" = synchronous d3.forceSimulation (cloned data — forceLink
// mutates links, which would corrupt the edges table).
function layout(nodes, edges, mode, W, H) {
  if (mode === "force") {
    const simNodes = nodes.map(n => ({...n}));
    const simLinks = edges.map(e => ({source: e.subject, target: e.object}));
    const sim = d3.forceSimulation(simNodes)
      .force("link", d3.forceLink(simLinks).id(d => d.id).distance(70))
      .force("charge", d3.forceManyBody().strength(-180))
      .force("center", d3.forceCenter(W/2, H/2))
      .force("collide", d3.forceCollide(16))
      .stop();
    for (let i = 0; i < 300; i++) sim.tick();
    return [Object.fromEntries(simNodes.map(n => [n.id, {x: n.x, y: n.y}])), []];
  }
  const byType = d3.group(nodes, d => d.type);
  // known types in COLS order, then any unknown types appended so a
  // new NodeType can never leave nodes unpositioned (pos[d.id] crash)
  const cols = COLS.filter(t => byType.has(t))
    .concat([...byType.keys()].filter(t => !COLS.includes(t)));
  const x = d3.scalePoint(cols, [90, W-90]);
  const pos = {};
  cols.forEach(t => {
    const ns = byType.get(t);
    const y = d3.scalePoint(d3.range(ns.length), [45, H-30]);
    ns.forEach((n,i) => pos[n.id] = {x:x(t), y:y(i)});
  });
  return [pos, cols];
}

const ellipsize = (s, n=26) => s.length > n ? s.slice(0, n-1) + "…" : s;

function render(g) {
  // collapsible summary block above the network (full analysis only)
  const sum = g.metadata.summary;
  const det = document.getElementById("summary");
  det.hidden = !sum || !sum.length;
  if (!det.hidden)
    document.getElementById("summarylist").innerHTML = sum
      .map(s => `<li>${esc(s.claim)} <span class="sumconf">${(+s.confidence).toFixed(2)}</span></li>`)
      .join("");

  const nodes = Object.values(g.nodes), edges = g.edges;
  const svg = d3.select("#net"); svg.selectAll("*").remove();
  const W = 1400, H = 700;
  const mode = $("#layout").value;
  const [pos, cols] = layout(nodes, edges, mode, W, H);

  // everything lives in .viewport so d3.zoom pans/zooms the whole scene
  const vp = svg.append("g").attr("class", "viewport");
  svg.call(zoom);
  // re-apply the persisted transform to the fresh viewport (re-renders
  // from the min-conf slider keep the user's pan/zoom)
  vp.attr("transform", d3.zoomTransform(svg.node()));

  if (mode === "columns") {
    const x = d3.scalePoint(cols, [90, W-90]);
    vp.selectAll(".colhead").data(cols).join("text").attr("class","colhead")
      .attr("x", d=>x(d)).attr("y", 20).attr("text-anchor","middle").text(d=>d);
  }
  vp.selectAll(".link").data(edges).join("path").attr("class","link")
    .attr("d", e => { const s=pos[e.subject], t=pos[e.object]; if(!s||!t) return "";
      const mx=(s.x+t.x)/2; return `M${s.x},${s.y} C${mx},${s.y} ${mx},${t.y} ${t.x},${t.y}`; })
    .attr("stroke","#718096").attr("stroke-opacity", e=>0.12+0.88*e.confidence)
    .attr("stroke-width", e=>0.5+2.5*e.confidence);
  // hover a node: emphasize it + directly-connected nodes/edges, dim rest
  const neighbors = new Map();
  edges.forEach(e => {
    (neighbors.get(e.subject) || neighbors.set(e.subject, new Set()).get(e.subject)).add(e.object);
    (neighbors.get(e.object) || neighbors.set(e.object, new Set()).get(e.object)).add(e.subject);
  });
  const linkSel = vp.selectAll(".link");
  const nodeG = vp.selectAll(".nodeg").data(nodes).join("g").attr("class","nodeg")
    .attr("transform", d=>`translate(${pos[d.id].x},${pos[d.id].y})`)
    .style("cursor", d=>d.url?"pointer":"default")
    .on("click", (e,d)=>{ if(d.url) window.open(d.url,"_blank"); })
    .on("mouseenter", (e,d) => {
      const nb = neighbors.get(d.id) || new Set();
      nodeG.classed("dim", n => n.id !== d.id && !nb.has(n.id));
      linkSel.classed("link-dim", l => l.subject !== d.id && l.object !== d.id)
             .classed("link-hi", l => l.subject === d.id || l.object === d.id);
    })
    .on("mouseleave", () => {
      nodeG.classed("dim", false);
      linkSel.classed("link-dim", false).classed("link-hi", false);
    });
  nodeG.append("circle").attr("class","node").attr("r",5)
    .attr("fill", d=>COLORS[d.type]||"#999");
  nodeG.append("text").attr("class","nodelabel").attr("x",7).attr("y",3)
    .text(d=>ellipsize(d.label||d.id));
  nodeG.append("title").text(d=>`${d.label||d.id}\n${d.id} (${d.type})${d.url?"\nclick to open":""}`);

  // legend: colors for the types actually present
  const typesPresent = [...new Set(nodes.map(n => n.type))];
  document.getElementById("legend").innerHTML = typesPresent
    .map(t => `<span class="leg"><i style="background:${COLORS[t]||"#999"}"></i>${esc(t)}</span>`)
    .join("");

  const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const cell = id => byId[id] ? link(byId[id]) : esc(id);
  sortable("edges", edges, [
    {label:"subject", val:e=>e.subject, render:e=>cell(e.subject)},
    {label:"predicate", val:e=>e.predicate, render:e=>esc(e.predicate)},
    {label:"object", val:e=>e.object, render:e=>cell(e.object)},
    {label:"conf", val:e=>e.confidence, render:e=>e.confidence.toFixed(2), cls:"conf"},
  ], 3, -1);
  sortable("nodes", nodes, [
    {label:"id", val:n=>n.id, render:n=>esc(n.id)},
    {label:"type", val:n=>n.type, render:n=>esc(n.type)},
    {label:"label", val:n=>n.label||n.id, render:n=>link(n)},
    {label:"namespace", val:n=>n.id_namespace, render:n=>esc(n.id_namespace)},
    {label:"", val:n=>"", render:n=>n.type==="Gene" ? `<a href="#" class="resolve-next" data-id="${esc(n.id)}">resolve →</a>` : ""},
  ], 1, 1);
  // Wire resolve → buttons (delegated so they survive re-sorts/filters).
  document.querySelector("#nodes tbody").addEventListener("click", e => {
    const a = e.target.closest(".resolve-next");
    if (a) { e.preventDefault(); resolveNext(byId[a.dataset.id]); }
  });
}
</script>
</body>
</html>
