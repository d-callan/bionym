<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioNym</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root { --ink:#1a202c; --muted:#4a5568; --line:#cbd5e0; --bg:#f7fafc; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; color: var(--ink); background: var(--bg); }
  header { padding: 1.2rem 2rem; border-bottom: 1px solid var(--line); background: #fff; }
  h1 { font-size: 1.3rem; margin: 0 0 .6rem; }
  .tagline { font-size: .8rem; font-weight: normal; color: var(--muted); margin-left: .6rem; }
  .tagline a { color: #2b6cb0; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  input[type=text] { padding: .45rem .7rem; border: 1px solid var(--line); border-radius: 6px; font-size: .95rem; width: 22rem; }
  input[type=number] { width: 4.5rem; padding: .45rem .5rem; border: 1px solid var(--line); border-radius: 6px; }
  button { padding: .45rem 1rem; border: 0; border-radius: 6px; background: #2b6cb0; color: #fff; font-size: .95rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  label { font-size: .8rem; color: var(--muted); }
  #status { padding: .6rem 2rem; font-size: .85rem; color: var(--muted); }
  #status.error { color: #c53030; }
  main { padding: 0 2rem 3rem; }
  h2 { font-size: 1.05rem; margin: 1.6rem 0 .5rem; }
  svg { background: #fff; border: 1px solid var(--line); border-radius: 8px; width: 100%; height: auto; }
  table { border-collapse: collapse; font-size: .82rem; background: #fff; }
  th, td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  th { background: #edf2f7; position: sticky; top: 0; }
  .tablewrap { max-height: 22rem; overflow: auto; border-radius: 8px; }
  .node { stroke: #fff; stroke-width: 1px; cursor: default; }
  .nodelabel { font-size: 9px; pointer-events: none; }
  .link { fill: none; }
  .colhead { font-size: 11px; font-weight: 600; fill: var(--muted); }
  .conf { font-variant-numeric: tabular-nums; }
  .tfilter { font-size: .8rem; padding: .2rem .5rem; border: 1px solid var(--line); border-radius: 5px; font-weight: normal; }
  th { cursor: pointer; user-select: none; }
  th:hover { background: #e2e8f0; }
</style>
</head>
<body>
<header>
  <h1>BioNym <span class="tagline">identifiers → confidence-scored knowledge graphs, judged by <a href="https://typesafe.ai" target="_blank" rel="noopener">JEV (TypeSafe.ai)</a></span></h1>
  <form id="f">
    <input type="text" id="id" placeholder="identifier — e.g. PF3D7_0710100, 672, BRCA1" required>
    <button id="go" type="submit">Resolve</button>
    <label>min conf <input type="range" id="minconf" min="0" max="1" step="0.05" value="0" style="width:8rem;vertical-align:middle"><span id="minconfv">0.00</span></label>
  </form>
</header>
<div id="status">Enter an identifier to resolve.</div>
<main>
  <h2>Network</h2>
  <svg id="net" viewBox="0 0 1100 600" preserveAspectRatio="xMidYMid meet"></svg>
  <h2>Edges <input class="tfilter" data-for="edges" placeholder="filter…"></h2>
  <div class="tablewrap"><table id="edges"><thead><tr><th>subject</th><th>predicate</th><th>object</th><th>conf</th></tr></thead><tbody></tbody></table></div>
  <h2>Nodes <input class="tfilter" data-for="nodes" placeholder="filter…"></h2>
  <div class="tablewrap"><table id="nodes"><thead><tr><th>id</th><th>type</th><th>label</th><th>namespace</th></tr></thead><tbody></tbody></table></div>
</main>
<script>
const COLS = ["IdType","Gene","Organism","Assembly","OrthologGroup","Domain","GOTerm","Pathway","Dataset","Condition"];
const COLORS = {IdType:"#8d99ae",Gene:"#2b6cb0",Organism:"#2f855a",Assembly:"#b7791f",OrthologGroup:"#6b46c1",Domain:"#c05621",GOTerm:"#2c7a7b",Pathway:"#97266d",Dataset:"#4a5568",Condition:"#9b2c2c"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let GRAPH = null;

// Admin-configurable: point at the deployed backend. Not user-facing.
const BACKEND = "http://localhost:8001";
const DEPTH = 6;  // full pipeline

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const id = $("#id").value.trim();
  const status = $("#status"); status.className = ""; status.textContent = "Resolving " + id + "…";
  $("#go").disabled = true;
  try {
    const r = await fetch(`${BACKEND}/api/resolve?identifier=${encodeURIComponent(id)}&depth=${DEPTH}`);
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
    GRAPH = await r.json();
    renderFiltered();
    const u = (GRAPH.metadata.jev_usage||{}).total||{};
    status.textContent = `${Object.keys(GRAPH.nodes).length} nodes, ${GRAPH.edges.length} edges · JEV ${u.input_tokens||0}in/${u.output_tokens||0}out · stages: ${(GRAPH.metadata.stages||[]).join(", ")}`;
  } catch (err) {
    status.className = "error"; status.textContent = "Error: " + err.message;
  } finally { $("#go").disabled = false; }
});

$("#minconf").addEventListener("input", e => {
  $("#minconfv").textContent = (+e.target.value).toFixed(2);
  if (GRAPH) renderFiltered();
});

// Client-side mirror of KnowledgeGraph.filter_by_confidence: drop edges
// below threshold, then nodes with no remaining edges (keep query root).
function renderFiltered() {
  const min = +$("#minconf").value;
  const edges = GRAPH.edges.filter(e => e.confidence >= min);
  const keep = new Set(edges.flatMap(e => [e.subject, e.object]));
  keep.add(GRAPH.metadata.query);
  const nodes = Object.values(GRAPH.nodes).filter(n => keep.has(n.id));
  render({nodes: Object.fromEntries(nodes.map(n=>[n.id,n])), edges, metadata: GRAPH.metadata});
}

function link(n) {
  return n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.label||n.id)}</a>` : esc(n.label||n.id);
}

// Sortable + filterable table. cols: [{label, val(row), render(row), cls?}]
function sortable(tableId, rows, cols, initKey = null, initDir = 1) {
  const tbl = document.getElementById(tableId);
  const tbody = tbl.querySelector("tbody");
  const ths = [...tbl.querySelectorAll("th")];
  const state = {key: initKey, dir: initDir, filter: ""};
  const fi = document.querySelector(`.tfilter[data-for="${tableId}"]`);
  if (fi) fi.addEventListener("input", e => { state.filter = e.target.value.toLowerCase(); draw(); });
  ths.forEach((th, i) => th.addEventListener("click", () => {
    if (state.key === i) state.dir *= -1; else { state.key = i; state.dir = 1; }
    draw();
  }));
  function draw() {
    let rs = rows.filter(r => !state.filter || cols.some(c => String(c.val(r) ?? "").toLowerCase().includes(state.filter)));
    if (state.key !== null) {
      const c = cols[state.key];
      rs = rs.slice().sort((a, b) => {
        const x = c.val(a), y = c.val(b);
        return (typeof x === "number" && typeof y === "number" ? x - y : String(x ?? "").localeCompare(String(y ?? ""))) * state.dir;
      });
    }
    tbody.innerHTML = rs.map(r => "<tr>" + cols.map(c => `<td class="${c.cls || ""}">${c.render(r)}</td>`).join("") + "</tr>").join("");
    ths.forEach((th, i) => th.textContent = cols[i].label + (state.key === i ? (state.dir > 0 ? " ▲" : " ▼") : ""));
  }
  draw();
}

function render(g) {
  const nodes = Object.values(g.nodes), edges = g.edges;
  const svg = d3.select("#net"); svg.selectAll("*").remove();
  const W = 1100, H = 600;
  const byType = d3.group(nodes, d => d.type);
  const cols = COLS.filter(t => byType.has(t));
  const x = d3.scalePoint(cols, [70, W-70]);
  const pos = {};
  cols.forEach(t => {
    const ns = byType.get(t);
    const y = d3.scalePoint(d3.range(ns.length), [45, H-30]);
    ns.forEach((n,i) => pos[n.id] = {x:x(t), y:y(i)});
  });
  svg.selectAll(".colhead").data(cols).join("text").attr("class","colhead")
    .attr("x", d=>x(d)).attr("y", 20).attr("text-anchor","middle").text(d=>d);
  svg.selectAll(".link").data(edges).join("path").attr("class","link")
    .attr("d", e => { const s=pos[e.subject], t=pos[e.object]; if(!s||!t) return "";
      const mx=(s.x+t.x)/2; return `M${s.x},${s.y} C${mx},${s.y} ${mx},${t.y} ${t.x},${t.y}`; })
    .attr("stroke","#718096").attr("stroke-opacity", e=>0.12+0.88*e.confidence)
    .attr("stroke-width", e=>0.5+2.5*e.confidence);
  const nodeG = svg.selectAll(".nodeg").data(nodes).join("g").attr("class","nodeg")
    .attr("transform", d=>`translate(${pos[d.id].x},${pos[d.id].y})`)
    .style("cursor", d=>d.url?"pointer":"default")
    .on("click", (e,d)=>{ if(d.url) window.open(d.url,"_blank"); });
  nodeG.append("circle").attr("class","node").attr("r",5)
    .attr("fill", d=>COLORS[d.type]||"#999");
  nodeG.append("text").attr("class","nodelabel").attr("x",7).attr("y",3)
    .text(d=>(d.label||d.id).slice(0,22));
  nodeG.append("title").text(d=>`${d.id} (${d.type})${d.url?" — click to open":""}`);

  const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const cell = id => byId[id] ? link(byId[id]) : esc(id);
  sortable("edges", edges, [
    {label:"subject", val:e=>e.subject, render:e=>cell(e.subject)},
    {label:"predicate", val:e=>e.predicate, render:e=>esc(e.predicate)},
    {label:"object", val:e=>e.object, render:e=>cell(e.object)},
    {label:"conf", val:e=>e.confidence, render:e=>e.confidence.toFixed(2), cls:"conf"},
  ], 3, -1);
  sortable("nodes", nodes, [
    {label:"id", val:n=>n.id, render:n=>esc(n.id)},
    {label:"type", val:n=>n.type, render:n=>esc(n.type)},
    {label:"label", val:n=>n.label||n.id, render:n=>link(n)},
    {label:"namespace", val:n=>n.id_namespace, render:n=>esc(n.id_namespace)},
  ], 1, 1);
}
</script>
</body>
</html>
