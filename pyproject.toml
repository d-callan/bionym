[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idresolver"
version = "0.1.0"
description = "Resolve bioinformatics identifiers into confidence-scored knowledge graphs with JEV."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.6",
    "diskcache>=5.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
idresolver = "idresolver.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
